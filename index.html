<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comparo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Doto:wght@700&display=swap">
<style>
  /* Layout: one ruled column, editorial grotesk + mono labels; carmine marks what is live (active track, playing state, selected option). */
  :root {
    --bg: #f0ede8; --surface: #e4ded5; --ink: #2b2b2b; --muted: #6f6a63;
    --rule: #2b2b2b; --hair: #cdc6bc; --accent: #960018; --on-accent: #fbf3ee;
    --accent-ink: #960018; --warn: #8a5a00; --dot: transparent;
    --display: "Inter Tight", "Helvetica Neue", Arial, sans-serif;
    --text: "Inter", "Helvetica Neue", Arial, sans-serif;
    --mono: "Space Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --digits: "Doto", "Space Mono", ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #0b0b0b; --surface: #1c1c1c; --ink: #f1efec; --muted: #8f8b86;
    --rule: #4a4847; --hair: #2a2928; --accent: #960018; --on-accent: #ffffff;
    --accent-ink: #ef5d72; --warn: #ffcf5c; --dot: #262626; color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #0b0b0b; --surface: #1c1c1c; --ink: #f1efec; --muted: #8f8b86;
    --rule: #4a4847; --hair: #2a2928; --accent: #960018; --on-accent: #ffffff;
    --accent-ink: #ef5d72; --warn: #ffcf5c; --dot: #262626; color-scheme: dark; }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    background-image: radial-gradient(var(--dot) 1.2px, transparent 1.6px);
    background-size: 18px 18px;
    color: var(--ink);
    font: 16px/1.45 var(--text);
    padding-block: 28px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  main { width: 100%; max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 3px; }
  .mono { font-family: var(--mono); font-size: 13px; text-transform: uppercase; letter-spacing: .02em; }

  /* Masthead */
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
  .mark { font-family: var(--display); font-weight: 800; font-size: 26px; letter-spacing: -0.045em; }
  .mast { display: flex; flex-direction: column; gap: 14px; }
  .display {
    margin: 0; font-family: var(--display); font-weight: 800;
    font-size: clamp(84px, 22vw, 184px); line-height: .82; letter-spacing: -0.06em;
    display: flex; align-items: center; gap: .12em;
  }
  .display .dash { display: inline-block; width: .42em; height: .1em; background: var(--accent); }
  .strap {
    display: flex; justify-content: space-between; gap: 12px;
    border-top: 1.5px solid var(--rule); border-bottom: 4px solid var(--rule);
    padding: 6px 0;
  }

  /* Track rows */
  .slots { display: flex; flex-direction: column; border-top: 1.5px solid var(--rule); }
  .slot {
    position: relative;
    display: grid; grid-template-columns: 76px minmax(0, 1fr) auto; gap: 4px 16px; align-items: start;
    padding: 18px 12px 18px 0;
    border-bottom: 1.5px solid var(--rule);
    cursor: pointer; user-select: none;
    transition: background .15s, color .15s, padding .15s;
  }
  .slot .tag { font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: -0.03em; }
  .slot .body { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .slot .name { font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: -0.03em; line-height: 1.15; word-break: break-all; }
  .slot:not(.loaded) .name::after { content: " →"; }
  .slot .meta, .slot .loud { font-family: var(--mono); font-size: 12.5px; text-transform: uppercase; color: var(--muted); font-variant-numeric: tabular-nums; }
  .slot .loud:empty { display: none; }
  .slot .loud b { color: var(--ink); font-weight: 700; }
  .slot .loud .w { color: var(--warn); }
  .slot:hover, .slot.drag { background: var(--surface); padding-left: 12px; }
  .slot.active { background: var(--accent); color: var(--on-accent); padding-left: 12px; }
  .slot.active .meta, .slot.active .loud, .slot.active .loud b, .slot.active .loud .w { color: var(--on-accent); }
  .slot .replace {
    font-family: var(--mono); font-size: 12px; text-transform: uppercase;
    background: none; border: 1px solid currentColor; border-radius: 999px; padding: 4px 12px; cursor: pointer;
  }
  .slot:not(.loaded) .replace { display: none; }
  input[type=file] { display: none; }

  /* Transport */
  .transport { display: flex; flex-direction: column; gap: 14px; }
  .switch { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .switch button {
    height: 116px; border: 1.5px solid var(--rule); background: transparent; cursor: pointer;
    font-family: var(--display); font-weight: 800; font-size: 72px; letter-spacing: -0.05em; line-height: 1;
    display: flex; align-items: flex-end; justify-content: space-between; padding: 10px 14px;
  }
  .switch button small { font-family: var(--mono); font-size: 12px; font-weight: 400; letter-spacing: .02em; align-self: flex-start; }
  .switch button:disabled { cursor: default; opacity: .3; }
  .switch button.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .row { display: flex; align-items: center; gap: 12px; }
  .between { justify-content: space-between; }
  button.main {
    flex: 1; height: 58px; border: none; border-radius: 999px; cursor: pointer;
    background: var(--accent); color: var(--on-accent);
    display: flex; align-items: center; justify-content: space-between; padding: 0 24px;
    font-family: var(--mono); font-size: 17px;
  }
  button.main:disabled { opacity: .35; cursor: default; }
  .time { font-family: var(--digits); font-weight: 700; font-size: 26px; letter-spacing: .04em; font-variant-numeric: tabular-nums; white-space: nowrap; }
  input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
  label.loop { display: flex; gap: 8px; align-items: center; cursor: pointer; color: var(--muted); }
  label.loop input { accent-color: var(--accent); }
  .warn { color: var(--warn); font-size: 13px; }
  .warn:empty { display: none; }

  /* Options */
  .opt { display: flex; flex-direction: column; }
  .h2 { margin: 0 0 14px; font-family: var(--display); font-weight: 800; font-size: clamp(34px, 7vw, 48px); letter-spacing: -0.05em; line-height: 1; }
  .seg { display: flex; flex-direction: column; border-top: 1.5px solid var(--rule); }
  .seg button {
    display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
    background: none; border: none; border-bottom: 1.5px solid var(--rule);
    padding: 12px 0; text-align: left; cursor: pointer;
    font-family: var(--text); font-size: 20px; font-weight: 500; letter-spacing: -0.01em;
    transition: padding .15s, background .15s;
  }
  .seg button .d { font-family: var(--mono); font-size: 12px; text-transform: uppercase; color: var(--muted); text-align: right; }
  .seg button:hover { padding-left: 10px; }
  .seg button.on { color: var(--accent-ink); font-weight: 700; }
  .seg button.on span:first-child::before { content: ""; display: inline-block; width: 10px; height: 10px; background: var(--accent); margin-right: 12px; vertical-align: .12em; }
  .seg button.on .d { color: var(--accent-ink); }
  .note { margin-top: 12px; color: var(--muted); font-size: 14px; max-width: 62ch; font-variant-numeric: tabular-nums; }
  .note:empty { display: none; }
  .note b { color: var(--ink); font-weight: 600; }

  footer { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px 16px; color: var(--muted); border-top: 1.5px solid var(--rule); padding-top: 10px; }
  @media (max-width: 520px) {
    .slot { grid-template-columns: 52px minmax(0, 1fr); }
    .slot .replace { grid-column: 2; justify-self: start; margin-top: 6px; }
    .switch button { height: 96px; font-size: 60px; }
    .seg button { font-size: 18px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <div class="mast">
    <header class="top">
      <div class="mark">Comparo</div>
      <div class="mono" id="count">[0/2] fichiers</div>
    </header>
    <h1 class="display">A<span class="dash" aria-hidden="true"></span>B</h1>
    <div class="strap mono"><span>Comparaison A/B</span><span>WAV · lecture synchronisée</span></div>
  </div>

  <section class="slots">
    <div class="slot" data-k="A">
      <div class="tag">(A)</div>
      <div class="body">
        <div class="name">Déposer un .wav ici</div>
        <div class="meta">ou cliquer pour choisir</div>
        <div class="loud"></div>
      </div>
      <button class="replace" type="button">Changer</button>
      <input type="file" id="fileA" accept=".wav,audio/wav,audio/x-wav,audio/wave">
    </div>
    <div class="slot" data-k="B">
      <div class="tag">(B)</div>
      <div class="body">
        <div class="name">Déposer un .wav ici</div>
        <div class="meta">ou cliquer pour choisir</div>
        <div class="loud"></div>
      </div>
      <button class="replace" type="button">Changer</button>
      <input type="file" id="fileB" accept=".wav,audio/wav,audio/x-wav,audio/wave">
    </div>
  </section>

  <section class="transport">
    <div class="switch">
      <button data-k="A" class="on" disabled>A<small>[1]</small></button>
      <button data-k="B" disabled>B<small>[2]</small></button>
    </div>
    <div class="row">
      <button class="main" id="play" disabled title="Lecture / Pause (Espace)"><span>Lecture</span><span>▶</span></button>
      <div class="time" id="time">0:00/0:00</div>
    </div>
    <div class="row">
      <input type="range" id="seek" min="0" max="1000" value="0" step="1" disabled aria-label="Position">
    </div>
    <div class="row between">
      <div class="warn" id="warn"></div>
      <label class="loop mono"><input type="checkbox" id="loop"> Boucle</label>
    </div>
  </section>

  <section class="opt">
    <h2 class="h2">Écouter sur</h2>
    <div class="seg" id="sim">
      <button data-v="off" class="on"><span>Studio (original)</span><span class="d">Sans traitement</span></button>
      <button data-v="phone"><span>Haut-parleur de téléphone</span><span class="d">Mono · 500 Hz+</span></button>
      <button data-v="earbuds"><span>Écouteurs bas de gamme</span><span class="d">Pic 4,5 kHz</span></button>
      <button data-v="car"><span>Voiture</span><span class="d">+6 dB à 120 Hz</span></button>
      <button data-v="bt"><span>Enceinte Bluetooth</span><span class="d">Mono · limiteur</span></button>
    </div>
    <div class="note" id="simNote"></div>
  </section>

  <section class="opt">
    <h2 class="h2">Normalisation streaming</h2>
    <div class="seg" id="norm">
      <button data-v="off" class="on"><span>Aucune</span><span class="d">Niveau d’origine</span></button>
      <button data-v="spotify"><span>Spotify</span><span class="d">−14 LUFS</span></button>
      <button data-v="apple"><span>Apple Music</span><span class="d">−16 LUFS</span></button>
      <button data-v="youtube"><span>YouTube</span><span class="d">−14 LUFS</span></button>
    </div>
    <div class="note" id="normNote"></div>
  </section>

  <footer class="mono">
    <span>Espace lecture/pause · Tab ou ←→ basculer · A/B choisir</span>
    <span>© 2026 Comparo</span>
  </footer>
</main>

<!-- Loudness meter (ITU-R BS.1770-4 integrated loudness + 4x oversampled true peak), run in a worker -->
<script type="text/plain" id="meter-src">
function kCoefs(fs) {
  let f0 = 1681.974450955533, G = 3.999843853973347, Q = 0.7071752369554196;
  let K = Math.tan(Math.PI * f0 / fs), Vh = Math.pow(10, G / 20), Vb = Math.pow(Vh, 0.4996667741545416);
  let a0 = 1 + K / Q + K * K;
  const s1 = { b0: (Vh + Vb * K / Q + K * K) / a0, b1: 2 * (K * K - Vh) / a0, b2: (Vh - Vb * K / Q + K * K) / a0,
               a1: 2 * (K * K - 1) / a0, a2: (1 - K / Q + K * K) / a0 };
  f0 = 38.13547087602444; Q = 0.5003270373238773; K = Math.tan(Math.PI * f0 / fs);
  a0 = 1 + K / Q + K * K;
  const s2 = { b0: 1, b1: -2, b2: 1, a1: 2 * (K * K - 1) / a0, a2: (1 - K / Q + K * K) / a0 };
  return [s1, s2];
}
// 4x oversampling: windowed-sinc interpolation of the 3 in-between points
const P = 4, H = 8, TAPS = 2 * H;
const phases = [];
for (let p = 1; p < P; p++) {
  const c = new Float64Array(TAPS);
  for (let j = 0; j < TAPS; j++) {
    const k = j - H + 1, d = p / P - k;
    const sinc = Math.sin(Math.PI * d) / (Math.PI * d);
    const w = 0.5 * (1 + Math.cos(Math.PI * d / (H + 0.5)));
    c[j] = sinc * w;
  }
  phases.push(c);
}
onmessage = e => {
  const { chs, sr } = e.data;
  const [s1, s2] = kCoefs(sr);
  const seg = Math.round(sr * 0.1);
  const n = chs[0].length;
  const nseg = Math.floor(n / seg);
  const segE = new Float64Array(nseg);
  let peak = 0;
  for (let c = 0; c < chs.length; c++) {
    const x = chs[c];
    const wgt = chs.length >= 5 && (c === 4 || c === 5) ? 1.41 : (chs.length >= 6 && c === 3 ? 0 : 1);
    let x1 = 0, x2 = 0, y1 = 0, y2 = 0, z1 = 0, z2 = 0;
    for (let i = 0; i < n; i++) {
      const v = x[i];
      const a = Math.abs(v); if (a > peak) peak = a;
      const y = s1.b0 * v + s1.b1 * x1 + s1.b2 * x2 - s1.a1 * y1 - s1.a2 * y2;
      x2 = x1; x1 = v;
      const z = y - 2 * y1 + y2 - s2.a1 * z1 - s2.a2 * z2;
      y2 = y1; y1 = y;
      z2 = z1; z1 = z;
      const si = (i / seg) | 0;
      if (si < nseg) segE[si] += wgt * z * z;
    }
    for (let i = H - 1; i < n - H; i++) {
      for (let p = 0; p < P - 1; p++) {
        const cf = phases[p];
        let s = 0;
        for (let j = 0; j < TAPS; j++) s += x[i - H + 1 + j] * cf[j];
        if (s < 0) s = -s;
        if (s > peak) peak = s;
      }
    }
  }
  const blocks = [];
  for (let j = 0; j + 3 < nseg; j++) blocks.push((segE[j] + segE[j + 1] + segE[j + 2] + segE[j + 3]) / (4 * seg));
  const L = z => -0.691 + 10 * Math.log10(z);
  const mean = a => a.reduce((s, v) => s + v, 0) / a.length;
  let lufs = -Infinity;
  const abs = blocks.filter(z => L(z) > -70);
  if (abs.length) {
    const rel = L(mean(abs)) - 10;
    const g = abs.filter(z => L(z) > rel);
    if (g.length) lufs = L(mean(g));
  }
  postMessage({ lufs, tp: peak > 0 ? 20 * Math.log10(peak) : -Infinity });
};
</script>

<script>
(() => {
  // ---------- State ----------
  const tracks = { A: null, B: null };   // { name, bytes, info, buffer, meter }
  let ctx = null;
  let sw = {};        // A/B switch gains
  let normG = {};     // per-track normalization gains
  let sum = null;     // mix bus feeding the playback simulator
  let chain = [];     // simulator nodes
  let sources = [];
  let active = 'A';
  let playing = false;
  let startCtxTime = 0;
  let pauseOffset = 0;
  let raf = 0;
  let seeking = false;
  let simMode = 'off';
  let normMode = 'off';

  const $ = s => document.querySelector(s);
  const playBtn = $('#play');
  const seek = $('#seek');
  const timeEl = $('#time');
  const warnEl = $('#warn');
  const loopEl = $('#loop');
  const switchBtns = [...document.querySelectorAll('.switch button')];
  const slots = [...document.querySelectorAll('.slot')];
  const slotOf = k => slots.find(s => s.dataset.k === k);

  // ---------- Presets ----------
  // filters: [type, frequency, Q, gain dB]
  const SIM = {
    phone: {
      note: 'Mono, presque plus de basses sous 500 Hz, médiums durs, aigus coupés, petite pièce.',
      trim: -3, mono: true, comp: true,
      filters: [['highpass', 480, 0.9], ['highpass', 480, 0.7], ['peaking', 1000, 1.0, -2], ['peaking', 2600, 1.2, 6], ['lowpass', 9000, 0.7]],
      reverb: { len: 0.35, wet: 0.12 },
    },
    earbuds: {
      note: 'Stéréo, basses maigres, pic agressif vers 4–5 kHz, extrême aigu atténué.',
      trim: -5, mono: false, comp: false,
      filters: [['highpass', 90, 0.7], ['lowshelf', 220, 0, -4], ['peaking', 4500, 2.0, 6], ['lowpass', 13000, 0.7]],
      reverb: null,
    },
    car: {
      note: 'Basses gonflées par l’habitacle, bas-médiums qui traînent, aigus ternes, réflexions très courtes.',
      trim: -7, mono: false, comp: false,
      filters: [['highpass', 35, 0.7], ['lowshelf', 120, 0, 6], ['peaking', 320, 1.4, 3], ['peaking', 3000, 1.0, -3], ['lowpass', 11000, 0.7]],
      reverb: { len: 0.12, wet: 0.14 },
    },
    bt: {
      note: 'Mono, bosse de basse vers 130 Hz puis rien en dessous, limiteur intégré, pièce de taille moyenne.',
      trim: -5, mono: true, comp: true,
      filters: [['highpass', 75, 1.0], ['peaking', 130, 1.5, 5], ['peaking', 2500, 1.0, -2], ['lowpass', 15000, 0.7]],
      reverb: { len: 0.6, wet: 0.18 },
    },
  };

  const NORM = {
    spotify: { label: 'Spotify', target: -14, boost: true,
      note: 'Spotify (réglage « Normal ») : −14 LUFS. Les morceaux trop forts sont baissés, les plus calmes sont montés sans dépasser −1 dBTP.' },
    apple: { label: 'Apple Music', target: -16, boost: true,
      note: 'Apple Music (Sound Check) : −16 LUFS. Les morceaux trop forts sont baissés, les plus calmes sont montés dans la limite de leur marge de crête.' },
    youtube: { label: 'YouTube', target: -14, boost: false,
      note: 'YouTube : −14 LUFS. Les morceaux trop forts sont baissés, les plus calmes ne sont jamais montés.' },
  };

  function normGainDb(k) {
    const m = tracks[k]?.meter;
    const p = NORM[normMode];
    if (!p || !m || !isFinite(m.lufs)) return 0;
    let g = p.target - m.lufs;
    if (g > 0) g = p.boost ? Math.min(g, Math.max(0, -1 - m.tp)) : 0;
    return g;
  }

  // ---------- WAV header parsing (to keep the native sample rate) ----------
  function parseWav(buf) {
    const v = new DataView(buf);
    const tag = o => String.fromCharCode(v.getUint8(o), v.getUint8(o+1), v.getUint8(o+2), v.getUint8(o+3));
    if (buf.byteLength < 12 || !['RIFF','RF64'].includes(tag(0)) || tag(8) !== 'WAVE') return null;
    let o = 12;
    while (o + 8 <= buf.byteLength) {
      const id = tag(o), size = v.getUint32(o + 4, true);
      if (id === 'fmt ') {
        return {
          format: v.getUint16(o + 8, true),
          channels: v.getUint16(o + 10, true),
          sampleRate: v.getUint32(o + 12, true),
          bits: v.getUint16(o + 22, true),
        };
      }
      o += 8 + size + (size & 1);
    }
    return null;
  }

  // ---------- Audio graph ----------
  // source → normG[k] → sw[k] → sum → (simulator) → destination
  // With both options off, every gain on the audible path is exactly 1.0 and the simulator is bypassed:
  // samples reach the output untouched, at the files' native sample rate.
  function targetRate() {
    const t = tracks.A || tracks.B;
    return t && t.info ? t.info.sampleRate : undefined;
  }

  async function ensureContext() {
    const rate = targetRate();
    if (ctx && (!rate || ctx.sampleRate === rate)) return;
    if (ctx) { stopSources(); await ctx.close(); }
    try { ctx = new AudioContext({ sampleRate: rate, latencyHint: 'playback' }); }
    catch { ctx = new AudioContext({ latencyHint: 'playback' }); }
    sum = ctx.createGain();
    sw = {}; normG = {}; chain = [];
    for (const k of ['A', 'B']) {
      sw[k] = ctx.createGain();
      sw[k].gain.value = k === active ? 1 : 0;
      sw[k].connect(sum);
      normG[k] = ctx.createGain();
      normG[k].gain.value = Math.pow(10, normGainDb(k) / 20);
      normG[k].connect(sw[k]);
    }
    buildChain();
    for (const k of ['A', 'B']) if (tracks[k]) tracks[k].buffer = null;
  }

  function makeIR(len) {
    const n = Math.max(1, Math.round(ctx.sampleRate * len));
    const ir = ctx.createBuffer(2, n, ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = ir.getChannelData(c);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 4);
    }
    return ir;
  }

  function buildChain() {
    sum.disconnect();
    chain.forEach(n => n.disconnect());
    chain = [];
    const p = SIM[simMode];
    if (!p) { sum.connect(ctx.destination); return; }
    const add = n => { chain.push(n); return n; };
    let node = add(ctx.createGain());
    node.gain.value = Math.pow(10, p.trim / 20);
    sum.connect(node);
    if (p.mono) {
      const m = add(ctx.createGain());
      m.channelCount = 1; m.channelCountMode = 'explicit'; m.channelInterpretation = 'speakers';
      node.connect(m); node = m;
    }
    for (const [type, f, q, g] of p.filters) {
      const b = add(ctx.createBiquadFilter());
      b.type = type; b.frequency.value = f; if (q) b.Q.value = q; if (g) b.gain.value = g;
      node.connect(b); node = b;
    }
    if (p.comp) {
      const c = add(ctx.createDynamicsCompressor());
      c.threshold.value = -20; c.knee.value = 6; c.ratio.value = 4; c.attack.value = 0.005; c.release.value = 0.15;
      node.connect(c); node = c;
    }
    const out = add(ctx.createGain());
    node.connect(out);
    if (p.reverb) {
      const conv = add(ctx.createConvolver());
      conv.buffer = makeIR(p.reverb.len);
      const wet = add(ctx.createGain());
      wet.gain.value = p.reverb.wet;
      node.connect(conv); conv.connect(wet); wet.connect(out);
    }
    out.connect(ctx.destination);
  }

  function setSim(v) {
    simMode = v;
    if (ctx) {
      // short fade around the rewiring to avoid clicks
      const now = ctx.currentTime, g = sum.gain;
      g.cancelScheduledValues(now); g.setValueAtTime(g.value, now); g.linearRampToValueAtTime(0, now + 0.015);
      setTimeout(() => {
        buildChain();
        const t = ctx.currentTime;
        g.cancelScheduledValues(t); g.setValueAtTime(0, t); g.linearRampToValueAtTime(1, t + 0.015);
      }, 25);
    }
    updateOptions();
  }

  function applyNorm() {
    if (!ctx) return;
    const now = ctx.currentTime;
    for (const k of ['A', 'B']) {
      const g = normG[k].gain;
      g.cancelScheduledValues(now); g.setValueAtTime(g.value, now);
      g.linearRampToValueAtTime(Math.pow(10, normGainDb(k) / 20), now + 0.03);
    }
  }

  function setNorm(v) {
    normMode = v;
    applyNorm();
    updateOptions();
  }

  async function decodeAll() {
    await ensureContext();
    for (const k of ['A', 'B']) {
      const t = tracks[k];
      if (t && !t.buffer) t.buffer = await ctx.decodeAudioData(t.bytes.slice(0));
    }
  }

  // ---------- Loudness measurement ----------
  const meterURL = URL.createObjectURL(new Blob([$('#meter-src').textContent], { type: 'text/javascript' }));
  function measure(buffer) {
    return new Promise((resolve, reject) => {
      const w = new Worker(meterURL);
      const chs = [];
      for (let c = 0; c < buffer.numberOfChannels; c++) chs.push(buffer.getChannelData(c).slice());
      w.onmessage = e => { resolve(e.data); w.terminate(); };
      w.onerror = e => { reject(e); w.terminate(); };
      w.postMessage({ chs, sr: buffer.sampleRate }, chs.map(c => c.buffer));
    });
  }

  // ---------- Loading ----------
  async function loadFile(k, file) {
    if (!file) return;
    const wasPlaying = playing;
    if (playing) pause();
    const slot = slotOf(k);
    slot.querySelector('.name').textContent = file.name;
    slot.querySelector('.meta').textContent = 'Chargement…';
    slot.querySelector('.loud').textContent = '';
    let t;
    try {
      const bytes = await file.arrayBuffer();
      const info = parseWav(bytes);
      t = tracks[k] = { name: file.name, bytes, info, buffer: null, meter: null };
      await decodeAll();
      const b = t.buffer;
      const parts = [];
      if (info) {
        parts.push((info.sampleRate / 1000).toLocaleString('fr-FR') + ' kHz');
        parts.push(info.format === 3 ? info.bits + ' bit float' : info.bits + ' bit');
        parts.push(info.channels === 1 ? 'mono' : info.channels === 2 ? 'stéréo' : info.channels + ' canaux');
      }
      parts.push(fmt(b.duration));
      slot.querySelector('.meta').textContent = parts.join(' · ');
      slot.classList.add('loaded');
      slot.title = file.name;
    } catch (e) {
      tracks[k] = null;
      slot.classList.remove('loaded');
      slot.querySelector('.meta').textContent = 'Fichier illisible';
      console.error(e);
      t = null;
    }
    updateWarn();
    updateUI();
    updateOptions();
    if (wasPlaying) play();
    if (t) {
      slot.querySelector('.loud').textContent = 'Mesure du volume…';
      try { t.meter = await measure(t.buffer); } catch (e) { console.error(e); }
      if (tracks[k] === t) { applyNorm(); updateOptions(); }
    }
  }

  function updateWarn() {
    const a = tracks.A?.info, b = tracks.B?.info;
    const msgs = [];
    if (ctx && targetRate() && ctx.sampleRate !== targetRate())
      msgs.push(`Le navigateur ne supporte pas ${targetRate()} Hz : rééchantillonnage à ${ctx.sampleRate} Hz.`);
    if (a && b && a.sampleRate !== b.sampleRate)
      msgs.push(`Fréquences différentes (${a.sampleRate} / ${b.sampleRate} Hz) : B est rééchantillonné.`);
    warnEl.textContent = msgs.join(' ');
  }

  slots.forEach(slot => {
    const k = slot.dataset.k;
    const input = slot.querySelector('input');
    slot.addEventListener('click', e => { if (e.target !== input) input.click(); });
    input.addEventListener('change', () => { loadFile(k, input.files[0]); input.value = ''; });
    slot.addEventListener('dragover', e => { e.preventDefault(); slot.classList.add('drag'); });
    slot.addEventListener('dragleave', () => slot.classList.remove('drag'));
    slot.addEventListener('drop', e => {
      e.preventDefault(); slot.classList.remove('drag');
      const files = [...e.dataTransfer.files];
      if (files.length >= 2) { loadFile('A', files[0]).then(() => loadFile('B', files[1])); }
      else loadFile(k, files[0]);
    });
  });
  document.addEventListener('dragover', e => e.preventDefault());
  document.addEventListener('drop', e => {
    if (e.target.closest('.slot')) return;
    e.preventDefault();
    const files = [...e.dataTransfer.files];
    if (files.length >= 2) loadFile('A', files[0]).then(() => loadFile('B', files[1]));
    else if (files[0]) loadFile(!tracks.A ? 'A' : 'B', files[0]);
  });

  // ---------- Transport ----------
  const duration = () => Math.max(tracks.A?.buffer?.duration || 0, tracks.B?.buffer?.duration || 0);
  const position = () => playing ? ctx.currentTime - startCtxTime : pauseOffset;

  function stopSources() {
    for (const s of sources) { s.onended = null; try { s.stop(); } catch {} s.disconnect(); }
    sources = [];
  }

  async function play() {
    if (!tracks.A && !tracks.B) return;
    await decodeAll();
    await ctx.resume();
    if (pauseOffset >= duration()) pauseOffset = 0;
    stopSources();
    // Both sources are scheduled on the same clock instant: sample-accurate sync
    const when = ctx.currentTime + 0.05;
    for (const k of ['A', 'B']) {
      const t = tracks[k];
      if (!t || pauseOffset >= t.buffer.duration) continue;
      const s = ctx.createBufferSource();
      s.buffer = t.buffer;
      s.connect(normG[k]);
      s.start(when, pauseOffset);
      sources.push(s);
    }
    startCtxTime = when - pauseOffset;
    playing = true;
    updateUI();
    tick();
  }

  function pause() {
    if (!playing) return;
    pauseOffset = Math.min(position(), duration());
    playing = false;
    stopSources();
    cancelAnimationFrame(raf);
    updateUI();
  }

  function seekTo(sec) {
    pauseOffset = Math.max(0, Math.min(sec, duration()));
    if (playing) play(); else updateUI();
  }

  function setActive(k) {
    if (!tracks[k]) return;
    active = k;
    if (ctx) {
      // ~5 ms crossfade to avoid a click; afterwards the audible gain is exactly 1
      const now = ctx.currentTime, ramp = 0.005;
      for (const key of ['A', 'B']) {
        const p = sw[key].gain;
        p.cancelScheduledValues(now);
        p.setValueAtTime(p.value, now);
        p.linearRampToValueAtTime(key === k ? 1 : 0, now + ramp);
      }
    }
    updateUI();
  }

  function tick() {
    cancelAnimationFrame(raf);
    const step = () => {
      if (!playing) return;
      const d = duration();
      if (position() >= d) {
        if (loopEl.checked) { pauseOffset = 0; play(); return; }
        playing = false; pauseOffset = 0; stopSources(); updateUI(); return;
      }
      updateTime();
      raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
  }

  // ---------- UI ----------
  function fmt(s) {
    s = Math.max(0, s);
    const m = Math.floor(s / 60), r = Math.floor(s % 60);
    return `${m}:${String(r).padStart(2, '0')}`;
  }
  const num = (v, signed) => {
    if (!isFinite(v)) return '−∞';
    const s = Math.abs(v).toLocaleString('fr-FR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
    return (v < 0 && s !== '0,0' ? '−' : signed && v > 0 ? '+' : '') + s;
  };

  function updateTime() {
    const d = duration(), p = Math.min(position(), d);
    timeEl.textContent = `${fmt(p)}/${fmt(d)}`;
    if (!seeking) seek.value = d ? Math.round(p / d * 1000) : 0;
  }
  function updateUI() {
    const any = !!(tracks.A || tracks.B);
    playBtn.disabled = !any;
    seek.disabled = !any;
    playBtn.innerHTML = playing ? '<span>Pause</span><span>❚❚</span>' : '<span>Lecture</span><span>▶</span>';
    $('#count').textContent = `[${(tracks.A ? 1 : 0) + (tracks.B ? 1 : 0)}/2] fichiers`;
    if (!tracks[active] && any) { active = tracks.A ? 'A' : 'B'; setActive(active); return; }
    switchBtns.forEach(b => {
      b.disabled = !tracks[b.dataset.k];
      b.classList.toggle('on', b.dataset.k === active);
    });
    slots.forEach(s => s.classList.toggle('active', s.dataset.k === active && !!tracks[s.dataset.k]));
    playBtn.classList.toggle('playing', playing);
    updateTime();
  }

  function updateOptions() {
    document.querySelectorAll('#sim button').forEach(b => b.classList.toggle('on', b.dataset.v === simMode));
    document.querySelectorAll('#norm button').forEach(b => b.classList.toggle('on', b.dataset.v === normMode));
    $('#simNote').textContent = SIM[simMode]?.note || '';

    const p = NORM[normMode];
    for (const k of ['A', 'B']) {
      const t = tracks[k], el = slotOf(k).querySelector('.loud');
      if (!t) { el.textContent = ''; continue; }
      if (!t.meter) continue;   // keeps "Mesure du volume…"
      const { lufs, tp } = t.meter;
      let html = `<b>${num(lufs)} LUFS</b> · <span class="${tp > -1 ? 'w' : ''}" title="${tp > -1 ? 'Crête au-dessus de −1 dBTP : risque de saturation après encodage' : ''}">${num(tp)} dBTP</span>`;
      if (p) html += ` · ${p.label} : <b>${num(normGainDb(k), true)} dB</b>`;
      el.innerHTML = html;
    }

    const note = $('#normNote');
    const ma = tracks.A?.meter, mb = tracks.B?.meter;
    let txt = p ? p.note : '';
    if (ma && mb && isFinite(ma.lufs) && isFinite(mb.lufs)) {
      const la = ma.lufs + normGainDb('A'), lb = mb.lufs + normGainDb('B');
      const d = la - lb;
      const who = Math.abs(d) < 0.05 ? 'A et B sont au même niveau'
        : `<b>${d > 0 ? 'A' : 'B'}</b> est ${num(Math.abs(d))} dB plus fort`;
      txt += (txt ? '<br>' : '') + (p
        ? `Après normalisation : A ${num(la)} LUFS, B ${num(lb)} LUFS. ${who}.`
        : `Sans normalisation : ${who}.`);
    }
    note.innerHTML = txt;
  }

  playBtn.addEventListener('click', () => playing ? pause() : play());
  switchBtns.forEach(b => b.addEventListener('click', () => setActive(b.dataset.k)));
  document.querySelectorAll('#sim button').forEach(b => b.addEventListener('click', () => setSim(b.dataset.v)));
  document.querySelectorAll('#norm button').forEach(b => b.addEventListener('click', () => setNorm(b.dataset.v)));
  seek.addEventListener('input', () => {
    seeking = true;
    const d = duration();
    timeEl.textContent = `${fmt(seek.value / 1000 * d)}/${fmt(d)}`;
  });
  seek.addEventListener('change', () => { seeking = false; seekTo(seek.value / 1000 * duration()); });
  slots.forEach(s => s.querySelector('.replace').addEventListener('click', e => {
    e.stopPropagation(); s.querySelector('input').click();
  }));

  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' && e.target.type !== 'range' && e.target.type !== 'checkbox') return;
    const key = e.key.toLowerCase();
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    else if (key === 'tab' || key === 'arrowleft' || key === 'arrowright') {
      e.preventDefault(); setActive(active === 'A' ? 'B' : 'A');
    }
    else if (key === 'a' || key === '1') setActive('A');
    else if (key === 'b' || key === '2') setActive('B');
  });

  updateUI();
  updateOptions();
})();
</script>
</body>
</html>
